name: Native Image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            executable: backend/target/blog
          - runner: windows-2022
            platform: windows-x64
            executable: backend/target/blog.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
      - name: Configure MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test backend and compile executable
        run: mvn -B -f backend/pom.xml -Pnative clean native:compile
      - name: Verify executable
        run: node tools/smoke-native.mjs ${{ matrix.executable }}
      - name: Package macOS with executable permissions
        if: runner.os == 'macOS'
        run: tar -C backend/target -czf blog-macos-arm64.tar.gz blog
      - uses: actions/upload-artifact@v4
        with:
          name: blog-${{ matrix.platform }}
          path: ${{ runner.os == 'macOS' && 'blog-macos-arm64.tar.gz' || matrix.executable }}
          if-no-files-found: error

  alpine:
    name: alpine-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Docker image
        run: |
          docker build --platform linux/${{ matrix.arch }} -t blog:alpine-${{ matrix.arch }} .
          node tools/smoke-native.mjs --docker blog:alpine-${{ matrix.arch }}
      - name: Save Docker image
        run: docker save blog:alpine-${{ matrix.arch }} | gzip > blog-alpine-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: blog-alpine-${{ matrix.arch }}
          path: blog-alpine-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
