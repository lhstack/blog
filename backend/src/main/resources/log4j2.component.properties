# Select the Disruptor-backed context before any application logger is created.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
# Bounded, low-idle-CPU queue. JVM system properties can override these defaults.
log4j2.asyncLoggerRingBufferSize=32768
log4j2.asyncLoggerWaitStrategy=Block
log4j2.asyncLoggerSynchronizeEnqueueWhenQueueFull=true
log4j2.asyncQueueFullPolicy=Default
